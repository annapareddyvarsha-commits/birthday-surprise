
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Video Surprise ❤️</title>

    <link rel="stylesheet" href="page5.css">
</head>

<body>

    <div class="container">

        <h1>🎂 A Special Birthday Surprise 🎂</h1>

        <p class="subtitle">
            This little surprise is only for you, my love! ❤️
        </p>

        <!-- Birthday Video -->

        <div class="video-box">

            <video id="birthdayVideo"
                   controls
                   playsinline
                   preload="auto">

                <source src="./birthday.mp4" type="video/mp4">

                Your browser does not support video playback.

            </video>

        </div>

        <!-- Play Button -->

        <button id="playButton" class="play-btn">
            ▶ Play Birthday Video 💗
        </button>

        <p class="volume-text">
            🔊 Turn up your volume and enjoy every moment!
        </p>

        <!-- Continue Button -->

        <button id="continueButton" class="continue-btn">
            Continue to the Surprise 💕
        </button>

        <p id="message"></p>

    </div>

    <script src="page5.js"></script>

</body>
</html>
